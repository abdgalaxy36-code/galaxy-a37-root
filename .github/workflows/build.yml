name: Build A37 Payload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip -q android-ndk-r29-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV

    - name: Build A37 payload
      run: |
        export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        make TARGET=a37-A376BXXS4AZG4

    - name: Verify output types
      run: |
        file build/a37-A376BXXS4AZG4/cve-2026-43499
        file build/a37-A376BXXS4AZG4/cve-2026-43499-root
        file build/a37-A376BXXS4AZG4/v2root
        file build/a37-A376BXXS4AZG4/cve-2026-43499-app.so
        @test -f build/a37-A376BXXS4AZG4/cve-2026-43499

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: a37-payload-A376BXXS4AZG4
        path: build/a37-A376BXXS4AZG4/
